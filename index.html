<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>再製作申請 OCRカメラ試作</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

      background: #07111f;
      color: #fff;
    }


    /* =========================
       タイトル
    ========================= */

    .header {
      background: #ffffff;
      color: #123b76;

      padding: 12px 10px;

      text-align: center;

      font-weight: 900;

      font-size: 20px;

      border-bottom: 4px solid #1769d2;
    }


    .sub {
      text-align: center;

      padding: 9px 10px;

      font-size: 14px;

      line-height: 1.4;

      background: #10223b;
    }



    /* =========================
       カメラエリア
    ========================= */

    .camera-wrap {
      position: relative;

      width: 100%;

      background: #000;

      overflow: hidden;
    }


    video {
      display: block;

      width: 100%;
      height: auto;

      min-height: 55vh;
      max-height: 76vh;

      object-fit: cover;

      background: #000;
    }



    /* =========================
       作業指示書 全体ガイド

       ★ 左側を詰めた
    ========================= */

    .sheet-frame {
      position: absolute;

      /*
        以前：left 4%
        ↓
        今回：left 15%

        左側の無駄な撮影範囲を狭くする
      */

      left: 15%;

      right: 3%;

      top: 8%;

      bottom: 8%;

      border:
        3px solid
        rgba(255,255,255,.95);

      pointer-events: none;
    }



    /* =========================
       赤い四隅
    ========================= */

    .corner {
      position: absolute;

      width: 28px;
      height: 28px;

      border-color: #ff2449;

      border-style: solid;

      pointer-events: none;
    }


    .tl {
      left: 14%;
      top: 7%;

      border-width:
        5px 0 0 5px;
    }


    .tr {
      right: 2%;
      top: 7%;

      border-width:
        5px 5px 0 0;
    }


    .bl {
      left: 14%;
      bottom: 7%;

      border-width:
        0 0 5px 5px;
    }


    .br {
      right: 2%;
      bottom: 7%;

      border-width:
        0 5px 5px 0;
    }



    /* =========================
       5色ガイド 共通
    ========================= */

    .guide {
      position: absolute;

      border: 3px solid;

      border-radius: 7px;

      font-weight: 900;

      font-size:
        clamp(12px, 2.7vw, 18px);

      padding: 3px 7px;

      color: #fff;

      /*
        塗りを以前より薄くした
        ↓
        指示書の文字を見やすくする
      */

      text-shadow:
        0 1px 3px
        rgba(0,0,0,.85);

      white-space: nowrap;

      pointer-events: none;
    }



    /* =========================
       ① 指示No.
       青
    ========================= */

    .g1 {

      border-color: #1674ff;

      background:
        rgba(22,116,255,.28);

      top: 18%;

      left: 46%;

      width: 25%;
    }



    /* =========================
       ② 製番
       緑
    ========================= */

    .g2 {

      border-color: #10a65a;

      background:
        rgba(16,166,90,.28);

      top: 18%;

      left: 72%;

      width: 25%;
    }



    /* =========================
       ③ 品番
       オレンジ
    ========================= */

    .g3 {

      border-color: #ff7a00;

      background:
        rgba(255,122,0,.25);

      top: 31%;

      left: 32%;

      width: 39%;
    }



    /* =========================
       ④ 品名
       紫
    ========================= */

    .g4 {

      border-color: #7b2cff;

      background:
        rgba(123,44,255,.25);

      top: 42%;

      left: 32%;

      width: 39%;
    }



    /* =========================
       ⑤ 客先
       ピンク
    ========================= */

    .g5 {

      border-color: #ff2ca3;

      background:
        rgba(255,44,163,.25);

      top: 42%;

      left: 72%;

      width: 25%;
    }



    /* =========================
       操作部
    ========================= */

    .controls {

      padding:
        12px 14px
        calc(
          12px +
          env(safe-area-inset-bottom)
        );

      background: #07111f;
    }


    button {

      width: 100%;

      border: none;

      border-radius: 16px;

      padding: 16px 10px;

      margin-bottom: 8px;

      font-size: 20px;

      font-weight: 900;

      cursor: pointer;
    }



    #startBtn {

      background:
        linear-gradient(
          90deg,
          #1976d2,
          #43a5ef
        );

      color: #fff;
    }



    #shotBtn {

      background:
        linear-gradient(
          90deg,
          #00a95c,
          #32d17d
        );

      color: #fff;

      display: none;
    }



    #retryBtn {

      background: #e9eef5;

      color: #26394d;

      display: none;
    }



    #status {

      text-align: center;

      padding: 7px;

      color: #bcd2e8;

      font-size: 14px;
    }



    /* =========================
       撮影画像
    ========================= */

    canvas {

      display: none;
    }



    #previewArea {

      display: none;

      background: #fff;

      color: #222;

      padding: 12px;
    }



    #previewArea h2 {

      margin: 4px 0 10px;

      text-align: center;

      color: #123b76;
    }



    #preview {

      display: block;

      width: 100%;

      border-radius: 10px;
    }



    /* =========================
       横向き最適化
    ========================= */

    @media (orientation: landscape) {

      .header {

        padding: 6px 10px;

        font-size: 17px;
      }


      .sub {

        padding: 6px 10px;

        font-size: 13px;
      }


      video {

        height:
          calc(
            100vh - 150px
          );

        min-height: 0;

        max-height: none;

        object-fit: cover;
      }


      .controls {

        padding: 7px 12px;
      }


      button {

        padding: 11px 8px;

        font-size: 18px;

        margin-bottom: 5px;
      }


      #status {

        padding: 3px;

        font-size: 12px;
      }


      .guide {

        font-size:
          clamp(
            12px,
            2vw,
            18px
          );
      }

    }



    /* =========================
       縦向き
    ========================= */

    @media (orientation: portrait) {

      .sheet-frame {

        left: 8%;
        right: 4%;
      }


      .tl,
      .bl {

        left: 7%;
      }


      .tr,
      .br {

        right: 3%;
      }


      .g1 {

        left: 52%;

        width: 24%;
      }


      .g2 {

        left: 77%;

        width: 20%;
      }


      .g3,
      .g4 {

        left: 39%;

        width: 37%;
      }


      .g5 {

        left: 77%;

        width: 20%;
      }

    }

  </style>
</head>



<body>


  <div class="header">

    METAL ENGINEER
    <br>

    再製作申請 OCRカメラ試作

  </div>



  <div class="sub">

    5色のガイドに
    作業指示書の各項目を
    合わせてください。

  </div>



  <div
    class="camera-wrap"
    id="cameraWrap"
  >


    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>



    <!-- 作業指示書 全体枠 -->

    <div class="sheet-frame"></div>



    <!-- 四隅 -->

    <div class="corner tl"></div>

    <div class="corner tr"></div>

    <div class="corner bl"></div>

    <div class="corner br"></div>



    <!-- 5色ガイド -->

    <div class="guide g1">
      ① 指示No.
    </div>


    <div class="guide g2">
      ② 製番
    </div>


    <div class="guide g3">
      ③ 品番
    </div>


    <div class="guide g4">
      ④ 品名
    </div>


    <div class="guide g5">
      ⑤ 客先
    </div>


  </div>



  <!--
    ★以前あった
    下の①〜⑤の説明ボタン列は
    今回完全削除
  -->



  <div class="controls">


    <button id="startBtn">

      📷 カメラを起動

    </button>



    <button id="shotBtn">

      📸 撮影

    </button>



    <button id="retryBtn">

      ↩️ 撮り直す

    </button>



    <div id="status">

      「カメラを起動」
      を押してください。

    </div>


  </div>



  <canvas id="canvas"></canvas>



  <div id="previewArea">

    <h2>
      撮影画像
    </h2>

    <img
      id="preview"
      alt="撮影画像"
    >

  </div>




<script>


/* =========================
   要素取得
========================= */


const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const startBtn =
  document.getElementById(
    "startBtn"
  );


const shotBtn =
  document.getElementById(
    "shotBtn"
  );


const retryBtn =
  document.getElementById(
    "retryBtn"
  );


const statusText =
  document.getElementById(
    "status"
  );


const cameraWrap =
  document.getElementById(
    "cameraWrap"
  );


const previewArea =
  document.getElementById(
    "previewArea"
  );


const preview =
  document.getElementById(
    "preview"
  );


let stream = null;



/* =========================
   カメラ起動
========================= */


async function startCamera() {


  statusText.textContent =
    "カメラを起動しています…";


  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      throw new Error(
        "このブラウザではカメラ機能を利用できません。"
      );

    }



    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }



    /*
      背面カメラ優先

      exact にしないことで
      iPhone
      Android
      その他端末でも
      動きやすくする
    */


    const constraints = {

      audio: false,

      video: {

        facingMode: {

          ideal:
            "environment"

        },

        width: {

          ideal: 1920

        },

        height: {

          ideal: 1080

        }

      }

    };



    stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );



    video.srcObject =
      stream;



    await video.play();



    startBtn.style.display =
      "none";


    shotBtn.style.display =
      "block";


    retryBtn.style.display =
      "none";


    cameraWrap.style.display =
      "block";


    previewArea.style.display =
      "none";



    statusText.textContent =
      "5色のガイドに合わせて「撮影」を押してください。";


  }


  catch (error) {


    console.error(
      error
    );


    statusText.textContent =
      "カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。";


  }

}



/* =========================
   撮影
========================= */


function takePhoto() {


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {


    statusText.textContent =
      "カメラ映像の準備ができていません。";


    return;

  }



  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;



  const ctx =
    canvas.getContext(
      "2d"
    );



  ctx.drawImage(

    video,

    0,

    0,

    canvas.width,

    canvas.height

  );



  /*
    JPEG化

    次の段階で
    この画像をOCRへ送る
  */


  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );



  preview.src =
    imageData;



  cameraWrap.style.display =
    "none";


  previewArea.style.display =
    "block";


  shotBtn.style.display =
    "none";


  retryBtn.style.display =
    "block";



  statusText.textContent =
    "撮影できました。画像を確認してください。";

}



/* =========================
   撮り直し
========================= */


function retryPhoto() {


  previewArea.style.display =
    "none";


  cameraWrap.style.display =
    "block";


  shotBtn.style.display =
    "block";


  retryBtn.style.display =
    "none";



  statusText.textContent =
    "5色のガイドに合わせて撮影してください。";

}



/* =========================
   ボタン
========================= */


startBtn.addEventListener(

  "click",

  startCamera

);



shotBtn.addEventListener(

  "click",

  takePhoto

);



retryBtn.addEventListener(

  "click",

  retryPhoto

);



/* =========================
   ページ終了時
========================= */


window.addEventListener(

  "pagehide",

  () => {


    if (stream) {


      stream
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );


    }


  }

);


</script>


</body>

</html>
